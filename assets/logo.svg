<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Logbook mark: a serif "L" under a tilted red stamp frame, on cream paper -->
  <rect x="8" y="8" width="112" height="112" rx="24" fill="#fdfbf5" stroke="#2a241b" stroke-width="7"/>
  <g transform="rotate(-6 64 64)">
    <rect x="30" y="30" width="68" height="68" rx="6" fill="none" stroke="#b23a2e" stroke-width="5"/>
  </g>
  <text x="64" y="89" text-anchor="middle"
        font-family="Iowan Old Style, Palatino, Georgia, 'DejaVu Serif', serif"
        font-size="68" font-weight="600" fill="#2a241b">L</text>
</svg>
